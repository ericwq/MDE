<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 630" font-family="Helvetica, Arial, sans-serif">
  <style>
    .cls { fill:#ffffff; stroke:#000000; stroke-width:1.6; }
    .lbl { fill:#b9b9b9; stroke:none; }
    .name { font-size:15px; font-style:italic; text-anchor:middle; }
    .anno { font-size:13.5px; fill:#ffffff; }
    .line { stroke:#000000; stroke-width:1.6; fill:none; }
    .tri { fill:#ffffff; stroke:#000000; stroke-width:1.6; }
    .dot { fill:#000000; }
  </style>

  <!-- NodeVisitor -->
  <rect class="cls" x="600" y="20" width="130" height="40"/>
  <text class="name" x="665" y="46">NodeVisitor</text>
  <polygon class="lbl" points="745,20 890,20 890,60 745,60"/>
  <text class="anno" x="757" y="45">Visitor</text>

  <!-- inheritance CatVisitor -> NodeVisitor -->
  <line class="line" x1="665" y1="110" x2="665" y2="60"/>
  <polygon class="tri" points="655,91 675,91 665,79"/>

  <!-- CatVisitor -->
  <rect class="cls" x="600" y="110" width="130" height="40"/>
  <text class="name" x="665" y="136">CatVisitor</text>
  <polygon class="lbl" points="745,110 900,110 900,150 745,150"/>
  <text class="anno" x="757" y="135">ConcreteVisitor</text>

  <!-- Node -->
  <rect class="cls" x="400" y="170" width="130" height="42"/>
  <text class="name" x="465" y="197">Node</text>

  <!-- Node annotations -->
  <polygon class="lbl" points="130,150 390,150 390,171 400,191 390,211 390,232 130,232"/>
  <text class="anno" x="145" y="172">Composite: Component</text>
  <text class="anno" x="145" y="190">Proxy: Subject</text>
  <text class="anno" x="145" y="208">TemplateMethod: AbstractClass</text>
  <text class="anno" x="145" y="226">Visitor: Element</text>

  <!-- generalization Node -> subclasses -->
  <line class="line" x1="465" y1="212" x2="465" y2="250"/>
  <polygon class="tri" points="455,270 475,270 465,250"/>
  <line class="line" x1="175" y1="270" x2="755" y2="270"/>
  <line class="line" x1="175" y1="270" x2="175" y2="330"/>
  <line class="line" x1="465" y1="270" x2="465" y2="330"/>
  <line class="line" x1="755" y1="270" x2="755" y2="330"/>

  <!-- Link / File / Directory -->
  <rect class="cls" x="110" y="330" width="130" height="40"/>
  <text class="name" x="175" y="356">Link</text>
  <rect class="cls" x="400" y="330" width="130" height="40"/>
  <text class="name" x="465" y="356">File</text>
  <rect class="cls" x="690" y="330" width="130" height="40"/>
  <text class="name" x="755" y="356">Directory</text>

  <!-- Link annotations -->
  <polygon class="lbl" points="60,380 290,380 290,440 60,440"/>
  <polygon class="lbl" points="155,380 195,380 175,370"/>
  <text class="anno" x="75" y="400">Leaf</text>
  <text class="anno" x="75" y="418">Proxy</text>
  <text class="anno" x="75" y="436">TemplateMethod: ConcreteClass</text>

  <!-- File annotations -->
  <polygon class="lbl" points="345,380 575,380 575,440 345,440"/>
  <polygon class="lbl" points="445,380 485,380 465,370"/>
  <text class="anno" x="360" y="400">Leaf</text>
  <text class="anno" x="360" y="418">Proxy: RealSubject</text>
  <text class="anno" x="360" y="436">TemplateMethod: ConcreteClass</text>

  <!-- Directory annotations -->
  <polygon class="lbl" points="630,380 860,380 860,440 630,440"/>
  <polygon class="lbl" points="735,380 775,380 755,370"/>
  <text class="anno" x="645" y="400">Composite</text>
  <text class="anno" x="645" y="418">Proxy: RealSubject</text>
  <text class="anno" x="645" y="436">TemplateMethod: ConcreteClass</text>

  <!-- User / Grouping / Group -->
  <rect class="cls" x="150" y="520" width="130" height="40"/>
  <text class="name" x="215" y="546">User</text>
  <rect class="cls" x="435" y="520" width="130" height="40"/>
  <text class="name" x="500" y="546">Grouping</text>
  <rect class="cls" x="720" y="520" width="130" height="40"/>
  <text class="name" x="785" y="546">Group</text>

  <!-- associations -->
  <line class="line" x1="432" y1="540" x2="298" y2="540"/>
  <circle class="dot" cx="432" cy="540" r="3"/>
  <polygon class="dot" points="298,532 286,540 298,548"/>
  <circle class="dot" cx="283" cy="540" r="3"/>
  <line class="line" x1="568" y1="540" x2="702" y2="540"/>
  <circle class="dot" cx="568" cy="540" r="3"/>
  <polygon class="dot" points="702,532 714,540 702,548"/>
  <circle class="dot" cx="717" cy="540" r="3"/>

  <!-- User annotations -->
  <polygon class="lbl" points="95,568 335,568 335,618 95,618"/>
  <polygon class="lbl" points="197,568 233,568 215,560"/>
  <text class="anno" x="110" y="590">Mediator: ConcreteColleague</text>
  <text class="anno" x="110" y="610">Singleton (variant)</text>

  <!-- Grouping annotations -->
  <polygon class="lbl" points="380,568 620,568 620,618 380,618"/>
  <polygon class="lbl" points="482,568 518,568 500,560"/>
  <text class="anno" x="395" y="590">ConcreteMediator</text>
  <text class="anno" x="395" y="610">Singleton</text>

  <!-- Group annotations -->
  <polygon class="lbl" points="665,568 905,568 905,618 665,618"/>
  <polygon class="lbl" points="767,568 803,568 785,560"/>
  <text class="anno" x="680" y="590">Mediator: ConcreteColleague</text>
</svg>
