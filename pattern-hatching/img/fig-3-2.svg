<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box { fill:#fff; stroke:#000; stroke-width:1.6; }
    .lbl { font-size:16px; font-weight:bold; text-anchor:end; }
    .val { font-size:16px; font-weight:bold; text-anchor:middle; }
    .unit { font-size:16px; font-weight:bold; }
    .opt { font-size:16px; font-weight:bold; }
    .arrow { fill:#000; }
  </style>

  <!-- Loan Amount -->
  <text class="lbl" x="175" y="47">Loan Amount:</text>
  <rect class="box" x="188" y="18" width="140" height="42"/>
  <text class="val" x="258" y="47">200000.00</text>
  <text class="unit" x="340" y="47">dollars</text>

  <!-- Rate -->
  <text class="lbl" x="175" y="117">Rate:</text>
  <rect class="box" x="188" y="88" width="62" height="42"/>
  <text class="val" x="219" y="117">8.25</text>
  <rect class="box" x="250" y="88" width="26" height="21"/>
  <rect class="box" x="250" y="109" width="26" height="21"/>
  <polygon class="arrow" points="256,104 270,104 263,92"/>
  <polygon class="arrow" points="256,114 270,114 263,126"/>
  <text class="unit" x="286" y="117">percent</text>

  <!-- Pay Period -->
  <text class="lbl" x="175" y="187">Pay Period:</text>
  <rect class="box" x="188" y="158" width="62" height="42"/>
  <text class="val" x="219" y="187">30</text>
  <rect class="box" x="250" y="158" width="26" height="21"/>
  <rect class="box" x="250" y="179" width="26" height="21"/>
  <polygon class="arrow" points="256,174 270,174 263,162"/>
  <polygon class="arrow" points="256,184 270,184 263,196"/>

  <!-- combo box -->
  <rect class="box" x="286" y="158" width="96" height="42"/>
  <text class="opt" x="296" y="187">years</text>
  <rect class="box" x="356" y="158" width="26" height="42"/>
  <polygon class="arrow" points="362,184 376,184 369,172"/>

  <!-- drop-down list -->
  <rect class="box" x="286" y="200" width="96" height="104"/>
  <rect x="290" y="204" width="88" height="32" fill="#000"/>
  <text x="296" y="226" font-size="16px" font-weight="bold" fill="#fff">years</text>
  <text class="opt" x="296" y="260">months</text>
  <text class="opt" x="296" y="294">weeks</text>
  <line x1="286" y1="236" x2="382" y2="236" stroke="#000" stroke-width="1.2"/>
  <line x1="286" y1="270" x2="382" y2="270" stroke="#000" stroke-width="1.2"/>
</svg>
