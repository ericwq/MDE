<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Helvetica, Arial, sans-serif">
  <style>
    .area { fill:#dcdcdc; stroke:#b0b0b0; stroke-width:1.2; stroke-dasharray:7 5; }
    .proxy { fill:none; stroke:#808080; stroke-width:1.2; stroke-dasharray:7 5; }
    .cls { fill:#ffffff; stroke:#000000; stroke-width:1.5; }
    .name { font-size:15px; font-style:italic; font-weight:bold; }
    .meth { font-size:13.5px; }
    .methi { font-size:13.5px; font-style:italic; }
    .label { font-size:12.5px; font-style:italic; }
    .line { stroke:#000000; stroke-width:1.4; fill:none; }
    .dot { fill:#000000; }
  </style>

  <!-- annotations -->
  <text class="label" x="55" y="30">from Proxy pattern</text>
  <text class="label" x="730" y="30">from Composite pattern</text>

  <!-- COMPOSITE area -->
  <rect class="area" x="370" y="42" width="590" height="400" rx="18"/>
  <!-- PROXY boundary -->
  <path class="proxy" d="M 90,55 L 610,55 Q 620,55 620,65 L 620,280 Q 620,290 610,290 L 370,290 Q 360,290 360,300 L 360,420 Q 360,430 350,430 L 100,430 Q 90,430 90,420 Z"/>

  <!-- Node -->
  <rect class="cls" x="400" y="70" width="170" height="150"/>
  <text class="name" x="412" y="92">Node</text>
  <line class="line" x1="400" y1="100" x2="570" y2="100"/>
  <text class="meth" x="412" y="118">getName()</text>
  <text class="meth" x="412" y="134">getProtection()</text>
  <text class="methi" x="412" y="150">streamIn(istream)</text>
  <text class="methi" x="412" y="166">streamOut(ostream)</text>
  <text class="meth" x="412" y="182">getChild(int)</text>
  <text class="meth" x="412" y="198">adopt(Node)</text>
  <text class="meth" x="412" y="214">orphan(Node)</text>

  <!-- generalization -->
  <polygon class="cls" points="475,236 505,236 490,220"/>
  <line class="line" x1="490" y1="236" x2="490" y2="270"/>
  <line class="line" x1="265" y1="270" x2="705" y2="270"/>
  <line class="line" x1="265" y1="270" x2="265" y2="320"/>
  <line class="line" x1="490" y1="270" x2="490" y2="320"/>
  <line class="line" x1="705" y1="270" x2="705" y2="320"/>

  <!-- subclasses -->
  <rect class="cls" x="180" y="320" width="170" height="100"/>
  <text class="name" x="192" y="342">Link</text>
  <line class="line" x1="180" y1="350" x2="350" y2="350"/>
  <text class="meth" x="192" y="368">streamIn(istream)</text>
  <text class="meth" x="192" y="385">streamOut(ostream)</text>
  <text class="meth" x="192" y="402">getSubject()</text>

  <rect class="cls" x="400" y="320" width="170" height="80"/>
  <text class="name" x="412" y="342">File</text>
  <line class="line" x1="400" y1="350" x2="570" y2="350"/>
  <text class="meth" x="412" y="368">streamIn(istream)</text>
  <text class="meth" x="412" y="385">streamOut(ostream)</text>

  <rect class="cls" x="620" y="320" width="170" height="120"/>
  <text class="name" x="632" y="342">Directory</text>
  <line class="line" x1="620" y1="350" x2="790" y2="350"/>
  <text class="meth" x="632" y="368">streamIn(istream)</text>
  <text class="meth" x="632" y="385">streamOut(ostream)</text>
  <text class="meth" x="632" y="402">getChild(int)</text>
  <text class="meth" x="632" y="419">adopt(Node)</text>
  <text class="meth" x="632" y="436">orphan(Node)</text>

  <!-- PROXY association: Link -> Node -->
  <line class="line" x1="265" y1="320" x2="265" y2="160"/>
  <line class="line" x1="265" y1="160" x2="398" y2="160"/>
  <circle class="dot" cx="398" cy="160" r="3.2"/>
  <polygon class="dot" points="386,154 398,160 386,166"/>
  <text class="label" x="130" y="300">subject</text>

  <!-- COMPOSITE aggregation: Directory -> Node -->
  <polygon class="cls" points="790,315 802,325 790,335 778,325"/>
  <line class="line" x1="802" y1="325" x2="860" y2="325"/>
  <line class="line" x1="860" y1="325" x2="860" y2="130"/>
  <line class="line" x1="860" y1="130" x2="536" y2="130"/>
  <circle class="dot" cx="534" cy="130" r="3.2"/>
  <polygon class="dot" points="546,124 534,130 546,136"/>
  <text class="label" x="812" y="350">children</text>
</svg>
