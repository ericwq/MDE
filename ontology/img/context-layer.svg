
<svg class = 'nodearc' id = '' version = '1.1' viewBox = '0 0 700 350' xmlns = 'http://www.w3.org/2000/svg'>
<style>@import url(https://fonts.googleapis.com/css?family=Open+Sans:300italic,400italic,300,400,600,700,800);

svg.nodearc {
  --default-fill: #F7F8FE;
  --default-stroke: #0f1872;
  --legend: #ef5ba1;
  --dash-stroke: 3,3;
  path {
    stroke: var(--default-stroke);
    fill: none; 
    stroke-width: 1.5;
  }
  .na-node {
    * {
      fill: var(--default-fill);
      stroke: var(--default-stroke);
      stroke-width: 2;
    }
  }

  
  foreignObject {
    overflow: visible;
    line-height: 1.1;
    font-family: Open Sans, sans-serif;
    font-size: 8pt;
  }
  
  p {
    margin: 0;
  }

  .na-node .label-center &gt; div {
    display: table;
    height: 100%;
    width: 100%;
    &amp; &gt; * {
      display: table-cell;
      vertical-align: middle;
      text-align: center;
      padding: 2px;
    }
  }

  .na-surround {
    rect {
      fill: #eeeeee;
      stroke: grey;
      stroke-width: 1.5;
    }
    div {
      padding: 3px;
      font-size: 7pt;
    }
  }


  .legend {
    font-style: italic;
    color: var(--legend);
  }

  path.legend-line {
    stroke: var(--legend)
  }
}
svg.nodearc {
  .bronze {
    fill: #E8C4A1;
  }
  .silver {
    fill: #C0C0C0;
  }
  .gold {
    fill: #FFD700;
  }
  .adaptive {
    fill: #E5C10C;
  }

  .na-surround .s-gold {
    fill: #FFFBEC;
    stroke:  #E5C10C;
  }

  .robot *  {
    stroke-width: 1;
  }

  .analyst * {
    stroke-width: 1;
    fill:  var(--default-fill);
  }


  .commentary {
    font-style: italic;
  }

  .return.line{
    stroke-dasharray: 3 3;
  }

  .pattern div {
    margin-top: 5px;
  }

  .pattern .label-center p {
    display: table-row;
  }

  
  .pattern .title {
    font-weight: bold;
  }


  .provenance {
    fill: none;
    stroke: grey;
  }


}

svg.nodearc{.flow_start {fill: var(--default-stroke)}}
svg.nodearc{.flow_target path {fill: var(--default-stroke)}}</style>

