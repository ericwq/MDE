<g class = 'na-arc'>
<path class = 'na-arc line' d = 'M 192 145.0 L 250.0 145.0'></path>

<path class = 'na-arc end-marker' d = 'M 0 0 l -12 -5 m 12 5 l -12 5' transform = 'rotate(0.0, 250.0, 145.0)translate(250.0 145.0)'></path>
</g>

<foreignObject class = 'na-text' height = '50' width = '150' x = '195.0' y = '125.0'>
